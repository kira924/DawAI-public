[project]
name = "dawai"
version = "1.0.0"
description = "Multi-tenant pharmacy management SaaS backend."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.4,<2",
    "bcrypt>=4.3,<5",
    "email-validator>=2.3,<3",
    "fastapi>=0.136.3,<0.137",
    "passlib[bcrypt]>=1.7.4,<2",
    "psycopg2-binary>=2.9.12,<3",
    "pydantic-settings>=2.14.1,<3",
    "pyjwt>=2.13,<3",
    "python-multipart>=0.0.32,<0.1",
    "sqlalchemy>=2.0.50,<2.1",
    "tzdata>=2025.2,<2027",
    "uvicorn>=0.48,<0.49",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "mypy>=1.17,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
required-version = ">=0.11.8,<0.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["Files", "alembic/versions", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "."
exclude = "^(Files|venv)/"

[[tool.mypy.overrides]]
module = ["src.main", "src.modules.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=src",
    "--cov-branch",
    "--cov-fail-under=55",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "integration: tests that require an isolated external service",
]
